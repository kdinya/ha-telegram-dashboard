name: "Telegram Dashboard (Beta)"
slug: "telegram_dashboard"
description: "[BETA] Interactive visual Telegram bot dashboard with role-based access control, areas, categories, scripts, automations and smart-speaker TTS"
version: "1.0.1"
url: "https://github.com/kdinya/ha-telegram-dashboard"
arch:
  - aarch64
  - amd64
  - armhf
  - armv7
  - i386
startup: application
boot: auto
init: false
homeassistant_api: true
panel_icon: "mdi:telegram"
panel_title: "Telegram Dash"
ingress: true
ingress_port: 8099
schema:
  telegram_token: password
  log_level: list(debug|info|warning|error)?
  default_role: list(guest|member|admin)?
options:
  telegram_token: ""
  log_level: "info"
  default_role: "guest"
