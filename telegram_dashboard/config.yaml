name: "Telegram Dashboard (Beta)"
slug: "telegram_dashboard"
description: "[BETA] Interactive visual Telegram dashboard for Home Assistant, working seamlessly via the official Telegram Bot integration"
version: "1.1.3"
url: "https://github.com/kdinya/ha-telegram-dashboard"
arch:
  - aarch64
  - amd64
  - armhf
  - armv7
  - i386
startup: application
boot: auto
init: false
map:
  - "homeassistant_config:rw"
homeassistant_api: true
panel_icon: mdi:send-circle
panel_title: "Telegram Dashboard"
ingress: true
ingress_port: 8099
schema:
  log_level: list(debug|info|warning|error)?
  default_role: list(guest|member|admin)?
options:
  log_level: "info"
  default_role: "guest"
